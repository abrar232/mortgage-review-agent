version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Mortgage@123
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - mortgage-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 -u admin:Mortgage@123 | grep -q opensearch"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=Mortgage@123
    depends_on:
      - opensearch
    networks:
      - mortgage-network

  mortgage-review-agent:
    build: .
    container_name: mortgage-review-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OPENSEARCH_ENDPOINT=https://opensearch:9200
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - mortgage-network

volumes:
  opensearch-data:

networks:
  mortgage-network:
    driver: bridge